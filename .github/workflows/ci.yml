name: Canton Name Service CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    name: Build, Test & SDK Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Daml SDK
        run: |
          curl -sSL https://get.daml.com/ | sh -s 3.1.0
          echo "$HOME/.daml/bin" >> $GITHUB_PATH

      - name: Build Daml contracts
        run: daml build

      - name: Run Daml tests
        run: daml test --color

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: sdk/package.json

      - name: Install SDK deps
        run: npm ci
        working-directory: sdk

      - name: Typecheck SDK
        run: npx tsc --noEmit
        working-directory: sdk
